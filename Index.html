<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Fundamentals Challenge</title>
</head>

<body>

    <h1>JavaScript Fundamentals Challenge</h1>

    <label>Enter your name:</label>
    <input type="text" id="name">

    <br><br>

    <label>Enter your age:</label>
    <input type="number" id="age">

    <br><br>

    <button onclick="showGreeting()">Submit</button>

    <p id="output"></p>

    <script>
        function showGreeting() {
            // Get the user's name and age
            let name = document.getElementById("name").value;
            let age = document.getElementById("age").value;

            let message;

            // Determine if the user is a minor or an adult
            if (age < 18) {
                message = "You are a minor.";
            } else {
                message = "You are an adult.";
            }

            // Generate the personalized greeting
            let greeting = "Hello, " + name + "! " + message;

            // Display the information
            document.getElementById("output").innerHTML = greeting;
        }
    </script>

</body>
</html>
